name: ai-operations-agent

services:
  ollama:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-cli:
    image: ollama/ollama:0.33.3
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - ollama
    profiles:
      - tools

volumes:
  ollama_data:
