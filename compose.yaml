name: ai-operations-agent

services:
  ollama:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-cli:
    image: ollama/ollama:0.33.3
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - ollama
    profiles:
      - tools

volumes:
  ollama_data:
