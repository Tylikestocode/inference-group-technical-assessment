name: ai-operations-agent

services:
  procedure-index:
    build:
      context: .
    command:
      - bank-ops
      - build-index
    environment:
      BANK_OPS_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      BANK_OPS_PROCEDURE_INDEX_DIR: /var/lib/bank-ops/retrieval
    profiles:
      - tools
    volumes:
      - procedure_index_data:/var/lib/bank-ops/retrieval

  api:
    build:
      context: .
    command:
      - uvicorn
      - bank_ops.transactions.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ollama:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-cli:
    image: ollama/ollama:0.33.3
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - ollama
    profiles:
      - tools

volumes:
  ollama_data:
  procedure_index_data:
