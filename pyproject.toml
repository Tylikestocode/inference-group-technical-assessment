[project]
name = "ai-operations-agent"
version = "0.1.0"
description = "A local AI Operations Agent prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
